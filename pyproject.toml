[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-zoo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "lightly[timm]>=1.5.25",
  "huggingface-hub<1",
  "pyyaml",
  "scikit-learn<1.4",
  "torch",
  "torchvision",
]

[project.scripts]
ssl-zoo = "eval.cli:main"

[tool.setuptools]
packages = ["eval", "models"]
